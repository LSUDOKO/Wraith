version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    groups:
      release-tooling:
        patterns: ["semantic-release", "@semantic-release/*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      # Next/React move together; a split bump usually fails to build.
      next:
        patterns: ["next", "react", "react-dom", "eslint-config-next"]
      viem:
        patterns: ["viem", "wagmi", "@wagmi/*"]

  - package-ecosystem: npm
    directory: /keeper
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: gomod
    directory: /extension
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      go-deps:
        patterns: ["*"]
